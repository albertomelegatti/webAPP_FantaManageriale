{% extends 'base_tailwind.html' %}

{% block content %}
{% import '_macros.html' as m %}
<div class="mx-auto mt-6 w-full max-w-sm">
    <div class="mb-2">{{ m.torna_indietro(url_for('user.squadra_login', nome_squadra=session.get('nome_squadra', ''))) }}</div>
    <div class="rounded-2xl border border-line bg-panel p-6">
        <h2 class="mb-5 text-center text-xl font-semibold">Cambia Password</h2>

    <form method="POST" action="/cambia_password" class="flex flex-col gap-3">
        <div class="relative">
            <input type="password" name="old_password" placeholder="Password attuale" required
                   class="w-full rounded-xl border border-line bg-panel px-4 py-3 pr-11 text-base outline-none focus:border-accent">
            <i class="bi bi-eye-slash togglePassword absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-muted"></i>
        </div>
        <div class="relative">
            <input type="password" name="new_password" placeholder="Nuova password" required
                   class="w-full rounded-xl border border-line bg-panel px-4 py-3 pr-11 text-base outline-none focus:border-accent">
            <i class="bi bi-eye-slash togglePassword absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-muted"></i>
        </div>
        <div class="relative">
            <input type="password" name="confirm_password" placeholder="Conferma nuova password" required
                   class="w-full rounded-xl border border-line bg-panel px-4 py-3 pr-11 text-base outline-none focus:border-accent">
            <i class="bi bi-eye-slash togglePassword absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-muted"></i>
        </div>

        <input type="submit" value="Cambia Password"
               class="mt-2 cursor-pointer rounded-xl bg-accent px-4 py-3 text-base font-semibold text-white hover:brightness-110">
    </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
