{% extends 'base_tailwind.html' %}

{% block content %}
{% import '_macros.html' as m %}
<style>
    /* Il CSS Tailwind e' precompilato: gli stili che servono solo qui stanno qui. */
    .chat-md p { margin: 0 0 .5rem; }
    .chat-md p:last-child, .chat-md ul:last-child, .chat-md ol:last-child { margin-bottom: 0; }
    .chat-md ul, .chat-md ol { margin: 0 0 .5rem; padding-left: 1.25rem; }
    .chat-md ul { list-style: disc; }
    .chat-md ol { list-style: decimal; }
    .chat-md h1, .chat-md h2, .chat-md h3, .chat-md h4 { font-weight: 700; margin: .25rem 0 .4rem; }
    .chat-md code { font-size: .8rem; padding: 0 .25rem; border-radius: .25rem; background: var(--color-bg); }
    .chat-md table { display: block; overflow-x: auto; border-collapse: collapse; margin: .25rem 0 .5rem; font-size: .8rem; }
    .chat-md th, .chat-md td { border: 1px solid var(--color-line); padding: .2rem .45rem; text-align: left; white-space: nowrap; }
    .chat-md th { background: var(--color-bg); }
    .chat-md a { color: var(--color-accent); text-decoration: underline; }
    .chat-suggerimento { border: 1px solid var(--color-line); }
    .chat-suggerimento:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .chat-form button:disabled { opacity: .5; }
    .chat-puntini span { display: inline-block; width: .4rem; height: .4rem; margin: 0 .1rem; border-radius: 9999px;
                         background: var(--color-muted); animation: chat-puntino 1.2s infinite ease-in-out; }
    .chat-puntini span:nth-child(2) { animation-delay: .15s; }
    .chat-puntini span:nth-child(3) { animation-delay: .3s; }
    @keyframes chat-puntino { 0%, 80%, 100% { opacity: .3; transform: translateY(0); }
                              40% { opacity: 1; transform: translateY(-3px); } }
</style>

<div class="mb-2">{{ m.torna_indietro(url_for('public.home')) }}</div>
<div class="mb-3 flex items-center justify-between">
    <h2 class="text-lg font-bold">Chatbot della lega</h2>
    <button type="button" id="chat-reset" class="text-xs text-muted hover:text-accent">
        <i class="bi bi-arrow-counterclockwise"></i> Nuova chat
    </button>
</div>

<div class="flex h-[70vh] flex-col rounded-2xl border border-line bg-panel">
    <div id="chat-box" class="flex flex-1 flex-col gap-2 overflow-y-auto p-3"></div>

    <div id="chat-suggerimenti" class="flex flex-wrap gap-2 px-3 pb-2"></div>

    <form id="chat-form" class="chat-form flex items-center gap-2 border-t border-line p-3">
        <input
            type="text"
            id="user_message"
            class="w-full flex-1 rounded-xl border border-line bg-panel-2 px-3 py-2 text-sm outline-none focus:border-accent"
            placeholder="Chiedi una regola, una rosa, i crediti…"
            autocomplete="off"
            maxlength="2000"
            required
        >
        <button type="submit" id="chat-invia"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-accent text-white">
            <i class="bi bi-send-fill"></i>
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user_message');
    const invia = document.getElementById('chat-invia');
    const chatBox = document.getElementById('chat-box');
    const boxSuggerimenti = document.getElementById('chat-suggerimenti');

    const BENVENUTO = '👋 Ciao! Posso rispondere sul **regolamento** e sui **dati della lega**: ' +
                      'crediti, rose, giocatori, movimenti, aste e albo d\'oro.';
    const SUGGERIMENTI = [
        'Quanti crediti ha ogni squadra?',
        'Quanto costa svincolare un giocatore?',
        'Come funziona il parametro zero?',
        'Chi ha vinto l\'ultimo campionato?',
    ];
    // La conversazione vive nel browser e viaggia con ogni domanda: il server
    // non conserva stato. sessionStorage la fa sopravvivere a un ricaricamento.
    const CHIAVE = 'chatbot-conversazione';

    let conversazione = [];
    try { conversazione = JSON.parse(sessionStorage.getItem(CHIAVE)) || []; } catch (e) { conversazione = []; }

    function salva() {
        try { sessionStorage.setItem(CHIAVE, JSON.stringify(conversazione)); } catch (e) { /* storage non disponibile */ }
    }

    function markdown(testo) {
        // Se le librerie dal CDN non sono arrivate, meglio testo semplice che
        // HTML non ripulito.
        if (window.marked && window.DOMPurify) {
            return DOMPurify.sanitize(marked.parse(testo, { breaks: true }));
        }
        return null;
    }

    function addBubble(testo, mittente) {
        const wrap = document.createElement('div');
        wrap.className = mittente === 'user' ? 'flex justify-end' : 'flex justify-start';

        const bubble = document.createElement('div');
        bubble.className = mittente === 'user'
            ? 'max-w-[85%] rounded-2xl rounded-br-sm bg-accent px-3 py-2 text-sm text-white'
            : 'chat-md max-w-[85%] rounded-2xl rounded-bl-sm bg-panel-2 px-3 py-2 text-sm';

        const html = mittente === 'user' ? null : markdown(testo);
        if (html !== null) {
            bubble.innerHTML = html;
        } else {
            bubble.textContent = testo;
        }

        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
        return wrap;
    }

    function addPuntini() {
        const wrap = document.createElement('div');
        wrap.className = 'flex justify-start';
        wrap.innerHTML = '<div class="chat-puntini rounded-2xl rounded-bl-sm bg-panel-2 px-3 py-3" ' +
                         'aria-label="Il chatbot sta scrivendo"><span></span><span></span><span></span></div>';
        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
        return wrap;
    }

    function mostraSuggerimenti() {
        boxSuggerimenti.innerHTML = '';
        if (conversazione.length) return;
        SUGGERIMENTI.forEach(function (s) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'chat-suggerimento rounded-full px-3 py-1 text-xs';
            b.textContent = s;
            b.addEventListener('click', function () { chiedi(s); });
            boxSuggerimenti.appendChild(b);
        });
    }

    function disegna() {
        chatBox.innerHTML = '';
        addBubble(BENVENUTO, 'bot');
        conversazione.forEach(function (m) { addBubble(m.content, m.role === 'user' ? 'user' : 'bot'); });
        mostraSuggerimenti();
    }

    function inAttesa(attesa) {
        input.disabled = attesa;
        invia.disabled = attesa;
        boxSuggerimenti.querySelectorAll('button').forEach(function (b) { b.disabled = attesa; });
        if (!attesa) input.focus();
    }

    function chiedi(msg) {
        msg = msg.trim();
        if (!msg || invia.disabled) return;

        conversazione.push({ role: 'user', content: msg });
        salva();
        boxSuggerimenti.innerHTML = '';
        addBubble(msg, 'user');
        input.value = '';
        inAttesa(true);
        const puntini = addPuntini();

        fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: conversazione })
        })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                puntini.remove();
                addBubble(data.answer, 'bot');
                // Gli errori non entrano nella cronologia: rimandati al modello
                // alla domanda successiva sembrerebbero risposte sue.
                if (!data.answer.startsWith('⚠️')) {
                    conversazione.push({ role: 'assistant', content: data.answer });
                } else {
                    conversazione.pop();
                }
                salva();
            })
            .catch(function () {
                puntini.remove();
                conversazione.pop();
                salva();
                addBubble('⚠️ Errore: impossibile contattare il server', 'bot');
            })
            .finally(function () { inAttesa(false); });
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        chiedi(input.value);
    });

    document.getElementById('chat-reset').addEventListener('click', function () {
        conversazione = [];
        salva();
        disegna();
        input.focus();
    });

    disegna();
});
</script>
{% endblock %}
