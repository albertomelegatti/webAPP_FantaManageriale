{% extends 'base_tailwind.html' %}

{% block content %}
{% import '_macros.html' as m %}
<div class="mb-2">{{ m.torna_indietro(url_for('admin.admin_home')) }}</div>
<h2 class="mb-4 text-lg font-bold">Gestione Crediti Squadre</h2>

<form id="form-crediti" method="POST" action="{{ url_for('admin.admin_crediti') }}" class="flex flex-col gap-2"
      onsubmit="return confirm('Sei sicuro di voler salvare tutti i crediti aggiornati?');">
    {% for squadra in squadre %}
    <div class="flex items-center gap-3 rounded-2xl border border-line bg-panel px-3 py-2.5">
        <span class="min-w-0 flex-1 truncate font-medium">{{ squadra.nome }}</span>
        <span class="shrink-0 text-xs text-muted">attuali {{ squadra.crediti }}</span>
        <input type="hidden" name="squadre[{{ loop.index0 }}][nome]" value="{{ squadra.nome }}">
        <input type="number" step="1" min="0"
               name="squadre[{{ loop.index0 }}][nuovo_credito]"
               class="w-20 shrink-0 rounded-xl border border-line bg-panel-2 px-2 py-1.5 text-center text-sm outline-none focus:border-accent"
               value="{{ squadra.crediti }}" required>
    </div>
    {% endfor %}

    <button type="submit"
            class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-accent px-4 py-3 text-sm font-semibold text-white">
        <i class="bi bi-save-fill"></i> Salva Tutto
    </button>
</form>
{% endblock %}
