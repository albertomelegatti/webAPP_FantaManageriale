<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Web App Fanta Manageriale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Applica subito il tema salvato, prima del paint, per evitare il flash -->
    <script>
        (function () {
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}?v={{ asset_v('css/tailwind.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v={{ asset_v('images/favicon.ico') }}" type="image/x-icon">
</head>
<body class="min-h-screen bg-bg text-text font-sans">

    <header class="sticky top-0 z-40 flex items-center justify-between gap-4 border-b border-line bg-panel px-4 py-3">
        <h1 class="text-lg font-bold">Fantacalcio Manageriale</h1>
        <div class="flex items-center gap-4 text-xl">
            <a href="/login" class="text-text/80 hover:text-accent"><i class="bi bi-person-circle"></i></a>
            <a href="/" class="text-text/80 hover:text-accent"><i class="bi bi-house-fill"></i></a>
            <a href="javascript:void(0)" id="darkModeToggle" class="text-text/80 hover:text-accent">
                <i class="bi bi-moon"></i>
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-4 pb-10">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-4 flex flex-col gap-2">
              {% for category, message in messages %}
                <div class="rounded-xl border border-line bg-panel-2 px-4 py-3 text-sm">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/theme.js') }}?v={{ asset_v('js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tooltip.js') }}?v={{ asset_v('js/tooltip.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
