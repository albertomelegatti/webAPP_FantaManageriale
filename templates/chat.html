{% extends 'base_tailwind.html' %}

{% block content %}
{% import '_macros.html' as m %}
<div class="mb-2">{{ m.torna_indietro(url_for('home')) }}</div>
<h2 class="mb-3 text-lg font-bold">Chatbot regolamento</h2>

<div class="flex h-[70vh] flex-col rounded-2xl border border-line bg-panel">
    <div id="chat-box" class="flex flex-1 flex-col gap-2 overflow-y-auto p-3">
        <div class="max-w-[85%] rounded-2xl rounded-bl-sm bg-panel-2 px-3 py-2 text-sm">
            👋 Ciao! Sono il tuo assistente del regolamento Fantacalcio.<br>
            Scrivimi una domanda per iniziare!
        </div>
    </div>

    <form id="chat-form" class="flex items-center gap-2 border-t border-line p-3">
        <input
            type="text"
            id="user_message"
            class="w-full flex-1 rounded-xl border border-line bg-panel-2 px-3 py-2 text-sm outline-none focus:border-accent"
            placeholder="Scrivi la tua domanda..."
            autocomplete="off"
            required
        >
        <button type="submit"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-accent text-white">
            <i class="bi bi-send-fill"></i>
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user_message');
    const chatBox = document.getElementById('chat-box');

    function addBubble(text, mittente) {
        const wrap = document.createElement('div');
        wrap.className = mittente === 'user' ? 'flex justify-end' : 'flex justify-start';

        const bubble = document.createElement('div');
        bubble.className = mittente === 'user'
            ? 'max-w-[85%] rounded-2xl rounded-br-sm bg-accent px-3 py-2 text-sm text-white'
            : 'max-w-[85%] rounded-2xl rounded-bl-sm bg-panel-2 px-3 py-2 text-sm';
        bubble.textContent = text;

        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const msg = input.value.trim();
        if (!msg) return;

        addBubble(msg, 'user');
        input.value = '';

        fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: msg })
        })
            .then(res => res.json())
            .then(data => addBubble(data.answer, 'bot'))
            .catch(() => addBubble('⚠️ Errore: impossibile contattare il server', 'bot'));
    });
});
</script>
{% endblock %}
