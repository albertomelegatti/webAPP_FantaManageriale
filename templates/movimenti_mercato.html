{% extends 'base_tailwind.html' %}

{% block content %}
<h2 class="mb-3 text-lg font-bold">Movimenti di Mercato</h2>

<div class="mb-4 rounded-2xl border border-line bg-panel p-4">
    <div class="grid grid-cols-2 gap-3">
        <div>
            <label class="mb-1.5 block text-[11px] font-bold uppercase tracking-wide text-muted">Stagione</label>
            <select id="filterStagione" class="w-full rounded-xl border border-line bg-panel-2 px-3 py-2 text-sm">
                <option value="">Tutte</option>
            </select>
        </div>
        <div>
            <label class="mb-1.5 block text-[11px] font-bold uppercase tracking-wide text-muted">Squadra</label>
            <select id="filterSquadra" class="w-full rounded-xl border border-line bg-panel-2 px-3 py-2 text-sm">
                <option value="">Tutte</option>
                {% for squadra in squadre %}
                <option value="{{ squadra.lower() }}">{{ squadra }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="mt-3">
        <label class="mb-1.5 block text-[11px] font-bold uppercase tracking-wide text-muted">Cerca</label>
        <input type="text" id="filterEvento" placeholder="Cerca nel messaggio..."
               class="w-full rounded-xl border border-line bg-panel-2 px-3 py-2 text-sm outline-none focus:border-accent">
    </div>
</div>

<div class="rounded-2xl border border-line bg-panel p-4">
    <button type="button" id="sortData"
            class="mb-2 flex items-center gap-1 text-[11px] font-bold uppercase tracking-wide text-muted">
        Data <span id="sortIcon">▼</span>
    </button>

    <div class="flex flex-col divide-y divide-line" id="mercatoBody">
        {% for m in mercato %}
        <div class="py-2.5 text-sm"
             data-stagione="{{ m.stagione }}" data-evento="{{ m.evento.lower() }}" data-date="{{ m.data }}">
            <div class="flex items-center justify-between gap-2 text-[11px] text-muted">
                <span>{{ m.data }}</span>
                <span>{{ m.stagione }}</span>
            </div>
            <button type="button" class="mercato-toggle mt-1 flex w-full items-start justify-between gap-2 text-left">
                <span class="evento-testo line-clamp-1 min-w-0 flex-1 break-words">{{ m.evento }}</span>
                <i class="bi bi-chevron-down chevron mt-0.5 shrink-0 text-muted transition-transform"></i>
            </button>
        </div>
        {% endfor %}
    </div>

    <p class="hidden py-4 text-center text-sm text-muted" id="noResults">Nessun movimento trovato con i filtri selezionati.</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const filterStagione = document.getElementById('filterStagione');
    const filterSquadra = document.getElementById('filterSquadra');
    const filterEvento = document.getElementById('filterEvento');
    const mercatoBody = document.getElementById('mercatoBody');
    const noResults = document.getElementById('noResults');
    const sortBtn = document.getElementById('sortData');
    const sortIcon = document.getElementById('sortIcon');
    const rows = Array.from(mercatoBody.children);

    let sortDirection = 'desc';

    const stagioni = new Set();
    rows.forEach(row => {
        const stagione = row.getAttribute('data-stagione');
        if (stagione) stagioni.add(stagione);
    });

    Array.from(stagioni).sort().reverse().forEach(stagione => {
        const option = document.createElement('option');
        option.value = stagione;
        option.textContent = stagione;
        filterStagione.appendChild(option);
    });

    function applyFilters() {
        const selectedStagione = filterStagione.value.toLowerCase();
        const selectedSquadra = filterSquadra.value.toLowerCase();
        const searchEvento = filterEvento.value.toLowerCase();
        let visibleCount = 0;

        rows.forEach(row => {
            const rowStagione = row.getAttribute('data-stagione').toLowerCase();
            const rowEvento = row.getAttribute('data-evento');

            const matchStagione = !selectedStagione || rowStagione === selectedStagione;
            const matchSquadra = !selectedSquadra || rowEvento.includes(selectedSquadra);
            const matchEvento = !searchEvento || rowEvento.includes(searchEvento);

            const visibile = matchStagione && matchSquadra && matchEvento;
            row.classList.toggle('hidden', !visibile);
            if (visibile) visibleCount++;
        });

        noResults.classList.toggle('hidden', visibleCount > 0);
    }

    sortBtn.addEventListener('click', function () {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        sortIcon.textContent = sortDirection === 'asc' ? '▲' : '▼';

        rows.sort((a, b) => {
            const dateA = new Date(a.getAttribute('data-date'));
            const dateB = new Date(b.getAttribute('data-date'));
            return sortDirection === 'asc' ? dateA - dateB : dateB - dateA;
        });

        rows.forEach(row => mercatoBody.appendChild(row));
    });

    filterStagione.addEventListener('change', applyFilters);
    filterSquadra.addEventListener('change', applyFilters);
    filterEvento.addEventListener('keyup', applyFilters);

    mercatoBody.querySelectorAll('.mercato-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const testo = btn.querySelector('.evento-testo');
            const chevron = btn.querySelector('.chevron');
            testo.classList.toggle('line-clamp-1');
            chevron.classList.toggle('rotate-180');
        });
    });
});
</script>
{% endblock %}
