{% extends 'base_tailwind.html' %}

{% block content %}
<h2 class="mb-3 text-lg font-bold">Squadre</h2>

<div class="flex flex-col gap-2">
    {% for squadra in squadre %}
    <a href="/squadra/{{ squadra.nome }}"
       class="flex items-center gap-3 rounded-2xl border border-line bg-panel p-3 transition hover:border-accent">
        {% set logo_file = 'loghi/' ~ squadra.username ~ '.png' %}
        <img src="{{ url_for('static', filename=logo_file) }}?v={{ asset_v(logo_file) }}"
             alt="Logo {{ squadra.nome }}"
             class="h-12 w-12 shrink-0 rounded-xl bg-panel-2 object-contain p-1">
        <span class="flex-1 truncate font-medium">{{ squadra.nome }}</span>
        <i class="bi bi-chevron-right shrink-0 text-muted"></i>
    </a>
    {% endfor %}
</div>
{% endblock %}
